name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: smo
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: smo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smo -d smo_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://smo:ci_only_password@127.0.0.1:5432/smo_test?schema=public
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:db
      - run: npm run build
