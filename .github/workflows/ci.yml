name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: smo
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: smo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smo -d smo_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27.8
        ports:
          - 1025:1025
          - 8025:8025
    env:
      BETTER_AUTH_SECRET: ci-only-synthetic-secret-not-a-production-credential-0001
      BETTER_AUTH_URL: http://localhost:3100
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'
      DATABASE_URL: postgresql://smo:ci_only_password@127.0.0.1:5432/smo_test?schema=public
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:seed
      - run: DEMO_REGISTRATION=true npm run nsuhw:keys -- init
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:db
      - run: docker compose --profile files up -d --wait clamav
      - run: npm run test:files
      - run: npm run test:ops
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:http
      - run: npm run test:account-switch
      - run: npm run test:live
      - run: npm run test:communications
      - run: npm run test:load
      - run: npm run build
      - run: npm run check:build
