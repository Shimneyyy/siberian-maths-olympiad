name: smo-dev
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: smo
      POSTGRES_PASSWORD: smo_local_only
      POSTGRES_DB: smo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smo -d smo"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  clamav:
    profiles: [files]
    image: clamav/clamav@sha256:6d87c712e3391e13c1ba6e05dfb074d4b1ddb5a6834b23bb9da990d2a4ef042a
    entrypoint: [clamd, --config-file=/etc/clamav/clamd-demo.conf]
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - ./infra/clamd-demo.conf:/etc/clamav/clamd-demo.conf:ro
    healthcheck:
      test: [CMD, clamdscan, --config-file=/etc/clamav/clamd-demo.conf, --ping=1]
      interval: 3s
      timeout: 5s
      retries: 40
    mem_limit: 2g
volumes:
  postgres_data:
