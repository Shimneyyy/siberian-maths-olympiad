name: smo-dev
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: smo
      POSTGRES_PASSWORD: smo_local_only
      POSTGRES_DB: smo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smo -d smo"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  postgres_data:
