name: smo-dev
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: smo
      POSTGRES_PASSWORD: smo_local_only
      POSTGRES_DB: smo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smo -d smo"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  pdf-inspector:
    image: smo-dev-pdf-inspector
    build:
      context: .
      dockerfile: infra/pdf-inspector/Dockerfile
    networks: [pdf_isolated]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3320/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
  pdf-relay:
    image: smo-dev-pdf-inspector
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3320/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    pull_policy: never
    command: [node, --jitless, --max-old-space-size=32, relay.mjs]
    depends_on:
      pdf-inspector:
        condition: service_healthy
    ports:
      - "127.0.0.1:3320:3320"
    networks: [default, pdf_isolated]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.25
networks:
  pdf_isolated:
    internal: true
volumes:
  postgres_data:
