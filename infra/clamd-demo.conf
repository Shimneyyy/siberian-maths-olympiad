# Synthetic local tests only; signatures bundled in pinned image, no freshness claim.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
TCPSocket 3310
TCPAddr 0.0.0.0
MaxThreads 2
MaxQueue 4
StreamMaxLength 10M
MaxFileSize 10M
MaxScanSize 50M
MaxRecursion 8
MaxFiles 1000
AlertExceedsMax yes
ReadTimeout 30
CommandReadTimeout 10
SendBufTimeout 1000
EnableShutdownCommand no
LogClean no
